name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for the whole workflow: this job only checks out
# code, typechecks, and runs tests — it never needs to write anything.
permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      # vlt isn't corepack-shimmed (unlike npm/yarn/pnpm), so it's
      # installed explicitly rather than via `corepack enable`.
      - run: npm install -g vlt
      - run: vlt install
      - run: vlt run typecheck
      - run: vlt run test
      # Nothing consumes dist/ here — this only proves the npm publish
      # build still emits, so a broken build surfaces on the PR rather
      # than on release day.
      - run: vlt run build
